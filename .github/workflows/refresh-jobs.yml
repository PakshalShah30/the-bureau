# Free hourly scheduler for any host (Vercel Hobby only allows daily crons).
# The endpoint refreshes only users not refreshed in ~6 hours, so extra calls are harmless.
# Setup: repo Settings → Secrets and variables → Actions → add
#   APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as the deployment's CRON_SECRET
name: Refresh jobs
on:
  schedule:
    - cron: "7 * * * *" # hourly, off the top of the hour to avoid GitHub's busiest minute
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-jobs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the refresh endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh")
          echo "HTTP $status"
          # Print counts only; the response never contains secrets but may list user ids.
          jq '{users, due, processed, remaining}' response.json || cat response.json
          test "$status" = "200"
